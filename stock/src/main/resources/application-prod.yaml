spring:
  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

app:
  base-url: ${APP_BASE_URL}
  upload:
    images: ${IMAGE_UPLOAD_DIR:/var/data/uploads}
  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:false}
    email: ${BOOTSTRAP_ADMIN_EMAIL:}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:}

jwt:
  secret: ${JWT_SECRET}
