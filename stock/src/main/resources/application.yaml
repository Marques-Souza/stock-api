server:
  port: ${PORT:8080}

spring:
  application:
    name: stock

  ## Local Server configuration
  mvc:
    locale-resolver: fixed
    locale: pt_BR

  datasource:
    driver-class-name: org.postgresql.Driver
    url: ${DB_URL:jdbc:postgresql://localhost:5432/stock_api}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}

  sql:
    init:
      mode: always

  ## JPA configuration
  jpa:
    show-sql: true
    defer-datasource-initialization: true
    hibernate:
      ddl-auto: update

## SpringDoc OpenApi Swagger configuration
springdoc:
  swagger-ui:
    path: /docs-stock.html
  api-docs:
    path: /docs-stock
  packages-to-scan: com.marquesdev.stock.controller

## API Endpoint configuration
app:
  base-url: ${APP_BASE_URL:http://localhost:8080}
  api:
    endpoints:
      users: /api/v1/users
      clients: /api/v1/clients
      suppliers: /api/v1/suppliers
      categories: /api/v1/categories
      products: /api/v1/products
      stock-movements: /api/v1/stock-movements
      reports: /api/v1/reports

  ## Image upload configuration
  upload:
    images: ${IMAGE_UPLOAD_DIR:./uploads}
    max-size: 5MB
    allowed-content-types: image/jpeg, image/png, image/webp

  bootstrap-admin:
    enabled: ${BOOTSTRAP_ADMIN_ENABLED:true}
    email: ${BOOTSTRAP_ADMIN_EMAIL:admin@stock.com}
    password: ${BOOTSTRAP_ADMIN_PASSWORD:admin123}

## JWT configuration
jwt:
  secret: ${JWT_SECRET:0123456789-0123456789-0123456789}