name: Stock API CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build, Tests & Package
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: stock

    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: stock_api
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: ci_test_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up Java 21 (Temurin)
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'
          cache-dependency-path: stock/pom.xml

      - name: Grant execute permission to Maven wrapper
        run: chmod +x mvnw

      - name: Run integration tests and package JAR
        env:
          DB_URL: jdbc:postgresql://localhost:5432/stock_api
          DB_USERNAME: postgres
          DB_PASSWORD: ci_test_password
          JWT_SECRET: ci-test-secret-key-at-least-32-characters-long
          APP_BASE_URL: http://localhost:8080
          IMAGE_UPLOAD_DIR: /tmp/stock-uploads
          BOOTSTRAP_ADMIN_ENABLED: "false"
        run: ./mvnw "-Dtest=*IT" clean package

      - name: Publish Test Report
        uses: dorny/test-reporter@v2
        if: always()
        with:
          name: Integration Test Results
          path: stock/target/surefire-reports/*.xml
          reporter: java-junit
          fail-on-error: false

      - name: Upload Application JAR Artifact
        uses: actions/upload-artifact@v4
        with:
          name: stock-api-jar
          path: stock/target/*.jar
          retention-days: 7

  docker-build:
    name: Validate Docker Image Build
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t stock-api:ci-test -f stock/Dockerfile stock